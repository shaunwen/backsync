[package]
name = "backsync"
version = "0.1.0"
edition = "2024"
description = "One-way mirror backup of a source folder to a target folder"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
filetime = "0.2.29"
indexmap = { version = "2.14.2", features = ["serde"] }
jwalk = "0.9.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
